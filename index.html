<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OH SHIT! Scorekaart</title><style>body{font:16px system-ui;margin:0;background:#edf2f7;color:#223248}header{background:#223248;color:white;padding:18px}h1{margin:0}main{padding:12px;max-width:1100px;margin:auto}.panel{background:white;border-radius:12px;padding:14px;margin-bottom:12px}button,input{font:inherit}button{border:0;border-radius:8px;padding:10px;background:#dce7f0;color:#223248;margin:3px}button.primary{background:#223248;color:white}input{border:1px solid #b7c7d6;border-radius:6px;padding:7px;box-sizing:border-box}input[type=number]{width:56px;text-align:center}.scroll{overflow:auto;max-height:65vh}table{border-collapse:collapse;min-width:max-content;width:100%}th,td{border:1px solid #dce4eb;padding:6px;text-align:center}thead th{position:sticky;top:0;background:#e8eef5;z-index:2}tfoot th,tfoot td{position:sticky;bottom:0;background:#dce9df;font-weight:800}td small{display:block;color:#66788b}.player{width:110px}.score{font-weight:700}.good{color:#147449}.bad{color:#a83232}.hint{color:#5a6d7d;font-size:14px}.warn{color:#a83232;font-weight:700}#rank div{padding:6px;border-bottom:1px solid #ddd}</style></head><body><header><h1>OH SHIT!</h1>Interactieve scorekaart</header><main><section class="panel"><label>Aantal spelers <select id="count"></select></label><button id="reset">Nieuw spel</button><button id="export">Exporteer CSV</button><p class="hint">V = voorspeld, B = behaald. De punten worden automatisch berekend. De tussenstand staat onderaan de tabel. Open bij voorkeur in Safari via een echte website voor betrouwbaar bewaren.</p><div id="status"></div></section><section class="panel"><div class="scroll"><table id="scoretable"></table></div></section><section class="panel"><h2>Ranglijst</h2><div id="rank"></div></section></main><script>
(function(){'use strict';var KEY='ohshit-v3';var state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.names))state={count:6,names:Array.from({length:10},(_,i)=>'Speler '+(i+1)),v:{},b:{}};function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){document.getElementById('status').textContent='Opslaan niet beschikbaar in deze viewer. Gebruik export CSV als back-up.'}}function score(v,b){if(v===''||b==='')return null;v=Number(v);b=Number(b);var d=Math.abs(v-b);return d===0?10+v*v:-10-5*(d-1)}function key(r,p){return r+'_'+p}var count=document.getElementById('count');for(var n=2;n<=10;n++){var op=document.createElement('option');op.value=n;op.textContent=n;count.appendChild(op)}count.value=state.count;count.onchange=function(){state.count=Number(count.value);save();render()};document.getElementById('reset').onclick=function(){if(confirm('Alle ingevulde scores wissen en nieuw spel starten?')){state.v={};state.b={};save();render()}};function el(tag,text){var e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}function input(type,value,callback){var e=el('input');e.type=type;e.value=value;e.addEventListener('input',function(){callback(e.value)});return e}function totals(){var t=Array(state.count).fill(0);for(var r=1;r<=13;r++)for(var p=0;p<state.count;p++){var s=score(state.v[key(r,p)]??'',state.b[key(r,p)]??'');if(s!==null)t[p]+=s}return t}function refresh(){var t=totals();for(var p=0;p<state.count;p++){document.getElementById('total'+p).textContent=t[p]}for(var r=1;r<=13;r++)for(var p=0;p<state.count;p++){var s=score(state.v[key(r,p)]??'',state.b[key(r,p)]??'');var cell=document.getElementById('score'+r+'_'+p);cell.textContent=s===null?'—':(s>0?'+':'')+s;cell.className='score '+(s===null?'':s>=0?'good':'bad')}var rank=document.getElementById('rank');rank.replaceChildren();t.map((v,p)=>({v,p})).sort((a,b)=>b.v-a.v).forEach((x,i)=>rank.appendChild(el('div',(i+1)+'. '+state.names[x.p]+' — '+x.v+' punten')));var warnings=[];for(var r=1;r<=13;r++){var values=Array.from({length:state.count},(_,p)=>state.b[key(r,p)]);if(values.every(x=>x!==undefined&&x!=='')){var sum=values.reduce((a,b)=>a+Number(b),0);if(sum!==r)warnings.push('Ronde '+r+': '+sum+' behaalde slagen ingevuld, verwacht '+r)}}document.getElementById('status').textContent=warnings.join(' | ');document.getElementById('status').className='warn'}function render(){var table=document.getElementById('scoretable');table.replaceChildren();var thead=el('thead'),tr=el('tr');tr.appendChild(el('th','Ronde'));for(let p=0;p<state.count;p++){var th=el('th'),name=input('text',state.names[p],v=>{state.names[p]=v;save();refresh()});name.className='player';th.appendChild(name);tr.appendChild(th)}thead.appendChild(tr);table.appendChild(thead);var body=el('tbody');for(let r=1;r<=13;r++){var row=el('tr');row.appendChild(el('th',r));for(let p=0;p<state.count;p++){let td=el('td'),k=key(r,p);let v=input('number',state.v[k]??'',val=>{state.v[k]=val;save();refresh()});let b=input('number',state.b[k]??'',val=>{state.b[k]=val;save();refresh()});v.min=b.min=0;v.max=b.max=r;v.placeholder='V';b.placeholder='B';td.appendChild(v);td.appendChild(b);let s=el('small');s.id='score'+r+'_'+p;td.appendChild(s);row.appendChild(td)}body.appendChild(row)}table.appendChild(body);var foot=el('tfoot'),frow=el('tr');frow.appendChild(el('th','Totaal'));for(let p=0;p<state.count;p++){var c=el('td');c.id='total'+p;frow.appendChild(c)}foot.appendChild(frow);table.appendChild(foot);refresh()}document.getElementById('export').onclick=function(){var rows=[['Ronde',...state.names.slice(0,state.count)]];for(var r=1;r<=13;r++)rows.push([r,...Array.from({length:state.count},(_,p)=>{var k=key(r,p);return 'V:'+ (state.v[k]??'')+' B:'+(state.b[k]??'')+' P:'+(score(state.v[k]??'',state.b[k]??'')??'')})]);rows.push(['Totaal',...totals()]);var csv=rows.map(a=>a.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');var a=el('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='OH_SHIT_scores.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render()})();
</script></body></html>
